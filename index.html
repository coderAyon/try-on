<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUMEN VISION | Enterprise Virtual Try-On</title>
    <meta name="description" content="Photorealistic 3D Virtual Try-On for Luxury Eyewear featuring real-time 468-point face mesh tracking, PBR shaders, and FittingBox fidelity." />
    <!-- Google Fonts: Inter & Cinzel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var _mod = window.Module;
          Object.defineProperty(window, 'Module', {
            configurable: true,
            enumerable: true,
            get: function() { return _mod; },
            set: function(val) {
              if (val && typeof val === 'object') {
                try { delete val.noExitRuntime; } catch(e){}
                try { val.noExitRuntime = true; } catch(e){}
              }
              _mod = val;
            }
          });
        try {
          var theme = localStorage.getItem('lumen_theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="antialiased overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
